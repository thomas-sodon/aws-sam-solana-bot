name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: processor-lambda

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Unit tests are hermetic; make sure the AWS SDK never probes for credentials.
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: processor-lambda/yarn.lock

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn unit
      - run: yarn bundle

  docker:
    name: Docker image build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lambda container image
        run: docker build --tag solana-bot-processor:ci .
